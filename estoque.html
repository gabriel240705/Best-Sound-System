<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estoque - Best Sound</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header>
    <h1>Estoque</h1>
    <p>Best Sound</p>
  </header>

  <main>

    <section>
      <h2>Novo Produto</h2>

      <form id="form-produto">

  <label for="produto">Nome do produto</label>
  <input type="text" id="produto" placeholder="Ex: FX360" required>

  <label for="marca">Marca</label>
  <input type="text" id="marca" placeholder="Ex: Positron">

  <label for="quantidade">Quantidade</label>
  <input type="number" id="quantidade" placeholder="Ex: 2" min="0" required>

  <label for="estoque-minimo">Estoque mínimo</label>
  <input type="number" id="estoque-minimo" placeholder="Ex: 1" min="0" required>

  <label for="custo">Preço de custo</label>
  <input type="number" id="custo" placeholder="Ex: 270" step="0.01">

  <label for="venda">Preço de venda</label>
  <input type="number" id="venda" placeholder="Ex: 440" step="0.01">

  <button type="submit">Salvar Produto</button>

</form>
    </section>

    <section>
      <h2>Produtos</h2>

     <input
      type="text"
      id="busca-produto"
      placeholder="Buscar produto ou marca..."
    >

      <div id="lista-produtos">
        <p>Nenhum produto cadastrado.</p>
      </div>
    </section>

    <a href="index.html">
      <button>Voltar</button>
    </a>

  </main>

  <script src="js/estoque.js"></script>

</body>
</html>
