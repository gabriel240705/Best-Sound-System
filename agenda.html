<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda - Best Sound</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header>
    <h1>Agenda</h1>
    <p>Best Sound</p>
  </header>

  <main>

    <section>
      <h2>Novo Agendamento</h2>

     <form id="form-agendamento">

  <label for="cliente">Nome do cliente</label>
  <input type="text" id="cliente" placeholder="Ex: Gabriel" required>

  <label for="carro">Carro / modelo</label>
  <input type="text" id="carro" placeholder="Ex: BMW 320i" required>

  <label for="placa">Placa</label>
  <input type="text" id="placa" placeholder="Ex: ABC1D23">

  <label for="servico">Serviço</label>
  <input type="text" id="servico" placeholder="Ex: Instalação de câmera de ré" required>

  <label for="data">Data</label>
  <input type="date" id="data" required>

  <label for="hora">Hora</label>
  <input type="time" id="hora" required>

  <label for="status">Status</label>
  <select id="status" required>
    <option value="Agendado">Agendado</option>
    <option value="Em serviço">Em serviço</option>
    <option value="Pronto">Pronto</option>
    <option value="Entregue">Entregue</option>
  </select>

  <button type="submit" id="btn-salvar-agendamento">
  Salvar Agendamento
</button>

</form>
    </section>

    <section>
      <h2>Agendamentos</h2>

      <input
       type="text"
       id="busca-agendamento"
       placeholder="Buscar cliente, carro ou placa..."
      >

      <div id="lista-agendamentos">
        <p>Nenhum agendamento cadastrado.</p>
      </div>
    </section>

    <a href="index.html">
      <button>Voltar</button>
    </a>

  </main>

  <script src="js/agenda.js"></script>

</body>
</html>
